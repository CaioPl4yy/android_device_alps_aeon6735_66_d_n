name: Build LineageOS 15.1 Go

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build (nothing = only parse the tree, a quick sanity check)
        type: choice
        default: bacon
        options: [nothing, bootimage, systemimage, bacon]
      variant:
        description: Build variant (userdebug also honors androidboot.selinux=permissive from the LK)
        type: choice
        default: userdebug
        options: [userdebug, eng]
      lineage_branch:
        description: LineageOS manifest branch
        default: lineage-15.1
      build_minutes:
        description: Time budget for the compile step (the job limit is 360 min, sync takes ~40)
        default: "250"

permissions:
  contents: read

concurrency:
  group: lineage-build
  cancel-in-progress: false

env:
  DEVICE: aeon6735_66_d_n

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      BLOBS_REPO: CaioPl4yy/aeon6735_66_d_n-blobs
      GH_TOKEN: ${{ secrets.BLOBS_TOKEN }}
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 1024
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Download webview from private release
        run: |
          echo "Baixando webview.apk..."
          gh release download v1.0 \
            --repo "$BLOBS_REPO" \
            --pattern "webview.apk" \
            --dir .
          ls -lh webview.apk

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-

      - name: Disk space
        run: df -h / "$GITHUB_WORKSPACE"

      - name: Write build script
        run: |
          cat > "$GITHUB_WORKSPACE/build.sh" << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive TZ=UTC LC_ALL=C

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            tzdata ca-certificates curl git gnupg flex bison gperf build-essential zip unzip \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            fontconfig python python3 openjdk-8-jdk-headless bc rsync lzop schedtool imagemagick \
            libssl-dev liblz4-tool libncurses5-dev lib32readline-dev libsdl1.2-dev pngcrush \
            squashfs-tools xz-utils file ccache

          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo

          git config --global user.name "lineage-ci"
          git config --global user.email "lineage-ci@users.noreply.github.com"
          git config --global color.ui false

          mkdir -p /work/lineage /work/artifacts
          cd /work/lineage

          repo init -u https://github.com/LineageOS/android.git -b "$BRANCH" --depth=1 -g default,-darwin

          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/remove_webview.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="LineageOS/android_external_chromium-webview_prebuilt_arm" />
            <remove-project name="LineageOS/android_external_chromium-webview_prebuilt_arm64" />
            <remove-project name="LineageOS/android_external_chromium-webview_prebuilt_x86" />
            <remove-project name="LineageOS/android_external_chromium-webview_prebuilt_x86_64" />
          </manifest>
          EOF

          repo sync -c -j "$(nproc)" --force-sync --no-clone-bundle --no-tags --optimized-fetch
          df -h /work

          echo "Injetando o webview.apk..."
          WEBVIEW_DIR="external/chromium-webview/prebuilt/arm64"
          mkdir -p "$WEBVIEW_DIR"
          cp /work/webview.apk "$WEBVIEW_DIR/webview.apk"

          cat > "$WEBVIEW_DIR/Android.mk" << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := webview
          LOCAL_MODULE_CLASS := APPS
          LOCAL_MODULE_TAGS := optional
          LOCAL_MODULE_SUFFIX := $(COMMON_ANDROID_PACKAGE_SUFFIX)
          LOCAL_CERTIFICATE := PRESIGNED
          LOCAL_SRC_FILES := webview.apk
          LOCAL_PRODUCT_MODULE := true
          include $(BUILD_PREBUILT)
          EOF

          DEVPATH="device/eastaeon/$DEVICE"
          mkdir -p "$DEVPATH"
          rsync -a --exclude .git --exclude .github /work/device-tree/ "$DEVPATH/"

          export USE_CCACHE=1
          export CCACHE_DIR=/work/ccache
          export CCACHE_COMPRESS=1
          mkdir -p "$CCACHE_DIR"
          prebuilts/misc/linux-x86/ccache/ccache -M 7G || true

          OUT="out/target/product/$DEVICE"
          set +e
          timeout --signal=INT --kill-after=120 "${BUILD_MINUTES}m" bash -c "
            set +u
            source build/envsetup.sh
            lunch lineage_${DEVICE}-${VARIANT} || exit 1
            m -j \$(nproc) $TARGET
          " 2>&1 | tee /work/artifacts/build.log | tail -n 40
          RC=${PIPESTATUS[0]}
          set -e

          if [ -f out/error.log ]; then
            tail -n 300 out/error.log > /work/artifacts/error_tail.log
          fi

          [ -f "$OUT/boot.img" ] && cp "$OUT/boot.img" /work/artifacts/ || true
          ls "$OUT"/lineage-*.zip >/dev/null 2>&1 && cp "$OUT"/lineage-*.zip* /work/artifacts/ || true

          if [ "$TARGET" = "systemimage" ] && [ -f "$OUT/system.img" ]; then
            gzip -1 -c "$OUT/system.img" > /work/artifacts/system.img.gz
          fi

          if [ -d "$OUT/system" ]; then
            python3 "$DEVPATH/tools/check_symbols.py" "$OUT/system" > /work/artifacts/unresolved_symbols.txt 2>&1 || true
          fi

          gzip -f /work/artifacts/build.log || true

          if [ "$RC" -eq 124 ]; then
            echo "::warning::Compile step hit the time budget. Run the workflow again: the ccache was saved and the next run resumes from it."
          fi

          exit "$RC"
          SCRIPT
          chmod +x "$GITHUB_WORKSPACE/build.sh"

      - name: Build (Ubuntu 18.04 container)
        env:
          BRANCH: ${{ inputs.lineage_branch }}
          VARIANT: ${{ inputs.variant }}
          TARGET: ${{ inputs.target }}
          BUILD_MINUTES: ${{ inputs.build_minutes }}
        run: |
          docker run --rm \
            -e DEVICE -e BRANCH -e VARIANT -e TARGET -e BUILD_MINUTES \
            -v "$GITHUB_WORKSPACE":/work \
            ubuntu:18.04 bash /work/build.sh

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-${{ env.DEVICE }}-${{ github.run_id }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-${{ env.DEVICE }}
          path: artifacts/*
          retention-days: 3
          if-no-files-found: warn
