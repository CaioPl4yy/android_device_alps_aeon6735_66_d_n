name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: "TWRP minimal manifest"
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git"
      manifest_branch:
        description: "Manifest branch: twrp-7.1 (3.1.x), twrp-8.1 (3.2.3), twrp-6.0 (3.0.x), twrp-9.0 (3.7.0_9-0, too big for the 16 MB partition)"
        default: "twrp-7.1"
      size_limit:
        description: "Recovery image size limit in bytes (16777216 = real partition size; raise only to inspect an oversized build, do not flash it)"
        default: "16777216"
      publish_release:
        description: "Publish recovery.img as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: twrp-build
  cancel-in-progress: true

env:
  DEVICE: aeon6735_66_d_n
  DEVICE_PATH: device/eastaeon/aeon6735_66_d_n
  PRODUCT: omni_aeon6735_66_d_n

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Check that the manifest branch exists
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: git ls-remote --exit-code --heads "$MANIFEST_URL" "$MANIFEST_BRANCH"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h / /mnt

      - name: Prepare work directory
        run: |
          sudo mkdir -p /mnt/twrp
          sudo chown "$USER" /mnt/twrp
          mkdir -p /mnt/twrp/device-tree
          rsync -a --exclude '.git' --exclude '.github' ./ /mnt/twrp/device-tree/

      - name: Write build script
        run: |
          cat > /mnt/twrp/build.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive TZ=UTC LC_ALL=C

          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            tzdata ca-certificates curl git git-core gnupg flex bison build-essential zip unzip \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev libncurses5 \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            fontconfig python2 python3 python-is-python2 openjdk-8-jdk-headless \
            bc rsync lz4 cpio libssl-dev ccache file

          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          git config --global user.name "twrp-ci"
          git config --global user.email "twrp-ci@users.noreply.github.com"
          git config --global color.ui false

          mkdir -p /work/src
          cd /work/src
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

          # Android 9 minimal tree: test modules that require device modules missing from the manifest
          { grep -rl --include=Android.mk --include=Android.bp 'OverlayHostTests' frameworks 2>/dev/null || true; } | xargs -r rm -fv

          # Debug info for the log: how TWRP references the linker
          grep -n 'linker' bootable/recovery/Android.mk | head -20 || true

          mkdir -p "$DEVICE_PATH"
          cp -a /work/device-tree/. "$DEVICE_PATH"/

          export ALLOW_MISSING_DEPENDENCIES=true
          set +u
          source build/envsetup.sh
          lunch "${PRODUCT}-eng"
          OUT="out/target/product/$DEVICE"
          set +e
          mka recoveryimage -j"$(nproc)" BOARD_RECOVERYIMAGE_PARTITION_SIZE="${SIZE_LIMIT:-16777216}"
          RC=$?
          set -eu

          echo "=== recovery ramdisk composition (largest first) ==="
          ls -l "$OUT/ramdisk-recovery.img" "$OUT/kernel" "$OUT/recovery.img" 2>&1 || true
          { (cd "$OUT/recovery/root" && du -ab . | sort -rn | head -45) || true; }
          echo "=== end of composition ==="
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi

          mkdir -p /work/artifacts
          cp "$OUT/recovery.img" /work/artifacts/recovery.img
          (cd /work/artifacts && sha256sum recovery.img > recovery.img.sha256)
          ls -l /work/artifacts
          SIZE=$(stat -c %s /work/artifacts/recovery.img)
          echo "recovery.img size: $SIZE bytes (partition limit: 16777216)"
          SCRIPT
          chmod +x /mnt/twrp/build.sh

      - name: Build TWRP (Ubuntu 20.04 container)
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
          SIZE_LIMIT: ${{ inputs.size_limit }}
        run: |
          docker run --rm \
            -e DEVICE -e DEVICE_PATH -e PRODUCT -e MANIFEST_URL -e MANIFEST_BRANCH -e SIZE_LIMIT \
            -v /mnt/twrp:/work \
            ubuntu:20.04 bash /work/build.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          sudo cp /mnt/twrp/artifacts/* artifacts/
          sudo chown -R "$USER" artifacts
          ls -l artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ env.DEVICE }}
          path: artifacts/*

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ inputs.manifest_branch }}-${{ github.run_number }}
          name: "TWRP (${{ inputs.manifest_branch }}) for aeon6735_66_d_n (MT6735 tablet)"
          files: |
            artifacts/recovery.img
            artifacts/recovery.img.sha256
          body: |
            Unofficial TWRP built from the `${{ inputs.manifest_branch }}` minimal manifest branch, for an unknown MT6735 tablet (stock Android 7.0, 800x1280, Mali-T720).

            **Status: untested build, flash at your own risk.**

            Install (no usable fastboot, use MTKClient):
            1. Back up seccfg, secro, nvram, nvdata, proinfo, protect1 and protect2 first.
            2. `python mtk w recovery recovery.img`
            3. Boot straight into recovery (Volume Up + Power) before letting Android start,
               otherwise the stock system may restore the stock recovery (recovery-from-boot.p).
